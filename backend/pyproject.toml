[tool.ruff]
line-length = 100
target-version = "py311"

# FastAPI dependency defaults are declaration metadata, not re-evaluated
# values, so they are safe as argument defaults (B008).
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Query", "fastapi.Header"]

[tool.black]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
